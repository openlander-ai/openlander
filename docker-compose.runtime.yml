services:
  openlander-db:
    image: postgres:16-alpine
    container_name: openlander-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: openlander
      POSTGRES_USER: openlander
      POSTGRES_PASSWORD: ${OPENLANDER_POSTGRES_PASSWORD:-openlander}
    volumes:
      - openlander-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openlander -d openlander']
      interval: 10s
      timeout: 5s
      retries: 5

  openlander:
    image: ${OPENLANDER_IMAGE:-ghcr.io/openlander-ai/openlander:latest}
    container_name: openlander
    restart: unless-stopped
    depends_on:
      openlander-db:
        condition: service_healthy
    environment:
      OPENLANDER_DATABASE_URL: postgres://openlander:${OPENLANDER_POSTGRES_PASSWORD:-openlander}@openlander-db:5432/openlander
      OPENLANDER_CONTAINERIZED: 'true'
      OPENLANDER_DATA_VOLUME: ${OPENLANDER_DATA_VOLUME:-openlander-data}
      OPENLANDER_PUBLIC_HOST: ${OPENLANDER_PUBLIC_HOST:-}
      OPENLANDER_PROTECTED_SHARE_TLS_MODE: ${OPENLANDER_PROTECTED_SHARE_TLS_MODE:-managed}
      OPENLANDER_CLOUDFLARE_OAUTH_CLIENT_ID: ${OPENLANDER_CLOUDFLARE_OAUTH_CLIENT_ID:-}
      OPENLANDER_CLOUDFLARE_OAUTH_REDIRECT_URI: ${OPENLANDER_CLOUDFLARE_OAUTH_REDIRECT_URI:-}
      OPENLANDER_CLOUDFLARE_OAUTH_SCOPES: ${OPENLANDER_CLOUDFLARE_OAUTH_SCOPES:-}
    ports:
      - '${OPENLANDER_PORT:-10114}:10114'
    volumes:
      - openlander-data:/root/.openlander
      - openlander-cloudflare:/run/openlander/cloudflare
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  openlander-data:
    name: openlander-data
  openlander-cloudflare:
    name: ${OPENLANDER_DATA_VOLUME:-openlander-data}-cloudflare
  openlander-postgres:
    name: openlander-postgres
