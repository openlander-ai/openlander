name: Release Gate

on:
  workflow_dispatch:
    inputs:
      rc_smoke:
        description: 'Run RC cold-agent smoke on a fresh GitHub-hosted Docker runner'
        type: boolean
        default: false
      rc_smoke_slow:
        description: 'Include slow compose lane in the RC cold-agent smoke'
        type: boolean
        default: false
      rc_image:
        description: 'Optional runtime image to smoke, for example ghcr.io/openlander-ai/openlander:0.1.9-rc.1'
        type: string
        default: ''
      rc_upgrade_from_image:
        description: 'Optional previous runtime image to start and upgrade from before the RC smoke'
        type: string
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  backend-release-gate:
    name: Backend release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENLANDER_DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openlander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openlander_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-11" npm@11.5.1 --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-11/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-11/node_modules/.bin/npm" --version

      - name: Install dependencies
        run: npm ci

      # Required for release-gated test/web/* files that import from web/src.
      # Those imports resolve React and related frontend packages from
      # web/node_modules, not the root install.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run release QA gate
        run: npm run qa:release

  rc-cold-agent-smoke:
    name: RC cold-agent smoke
    runs-on: ubuntu-latest
    needs: backend-release-gate
    timeout-minutes: 45
    if: ${{ inputs.rc_smoke }}
    env:
      OPENLANDER_IMAGE: ${{ inputs.rc_image || 'openlander:rc-smoke' }}
      OPENLANDER_UPGRADE_FROM_IMAGE: ${{ inputs.rc_upgrade_from_image }}
      OPENLANDER_PORT: 10114
      OPENLANDER_PUBLIC_HOST: 127.0.0.1.sslip.io
      OPENLANDER_POSTGRES_PASSWORD: openlander-rc-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Pin npm version
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-11" npm@11.5.1 --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-11/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-11/node_modules/.bin/npm" --version

      - name: Install dependencies
        run: npm ci

      - name: Build runtime image from this ref
        if: ${{ inputs.rc_image == '' }}
        run: |
          OPENLANDER_BUILD_DTS=false OPENLANDER_BUILD_SOURCEMAP=false bash scripts/build-runtime-image.sh

      - name: Pull runtime image
        if: ${{ inputs.rc_image != '' }}
        run: docker pull "$OPENLANDER_IMAGE"

      - name: Pull previous runtime image
        if: ${{ inputs.rc_upgrade_from_image != '' }}
        run: docker pull "$OPENLANDER_UPGRADE_FROM_IMAGE"

      - name: Start OpenLander runtime
        run: |
          if [[ -n "$OPENLANDER_UPGRADE_FROM_IMAGE" ]]; then
            OPENLANDER_IMAGE="$OPENLANDER_UPGRADE_FROM_IMAGE" docker compose -f docker-compose.runtime.yml up -d
          else
            docker compose -f docker-compose.runtime.yml up -d
          fi

      - name: Wait for OpenLander
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl -fsS "http://127.0.0.1:${OPENLANDER_PORT}/health" >/dev/null; then
              exit 0
            fi
            echo "OpenLander not ready yet (attempt ${attempt}/90)"
            docker compose -f docker-compose.runtime.yml ps
            sleep 2
          done
          docker compose -f docker-compose.runtime.yml logs --no-color
          exit 1

      - name: Seed previous-version state
        if: ${{ inputs.rc_upgrade_from_image != '' }}
        env:
          OPENLANDER_E2E_BASE_URL: http://localhost:10114
        run: node scripts/rc-upgrade-state-smoke.mjs seed "$RUNNER_TEMP/openlander-upgrade-state.json"

      - name: Upgrade OpenLander runtime
        if: ${{ inputs.rc_upgrade_from_image != '' }}
        run: docker compose -f docker-compose.runtime.yml up -d --no-deps --force-recreate openlander

      - name: Wait for upgraded OpenLander
        if: ${{ inputs.rc_upgrade_from_image != '' }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl -fsS "http://127.0.0.1:${OPENLANDER_PORT}/health" >/dev/null; then
              actual_image="$(docker inspect --format '{{.Config.Image}}' openlander)"
              test "$actual_image" = "$OPENLANDER_IMAGE"
              exit 0
            fi
            echo "Upgraded OpenLander not ready yet (attempt ${attempt}/90)"
            docker compose -f docker-compose.runtime.yml ps
            sleep 2
          done
          docker compose -f docker-compose.runtime.yml logs --no-color
          exit 1

      - name: Verify upgraded state
        if: ${{ inputs.rc_upgrade_from_image != '' }}
        env:
          OPENLANDER_E2E_BASE_URL: http://localhost:10114
        run: node scripts/rc-upgrade-state-smoke.mjs verify "$RUNNER_TEMP/openlander-upgrade-state.json"

      - name: Run RC cold-agent smoke
        env:
          OPENLANDER_E2E_BASE_URL: http://localhost:10114
          OPENLANDER_E2E_EPHEMERAL: '1'
          OPENLANDER_E2E_SLOW: ${{ inputs.rc_smoke_slow && '1' || '' }}
        run: npm run qa:rc-smoke

      - name: Dump runtime logs
        if: always()
        run: |
          docker ps -a
          docker compose -f docker-compose.runtime.yml logs --no-color || true

      - name: Stop OpenLander runtime
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/openlander-upgrade-state.json"
          docker compose -f docker-compose.runtime.yml down -v --remove-orphans
