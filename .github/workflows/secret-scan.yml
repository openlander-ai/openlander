name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # Pull requests: scan only the commits added by this PR. This catches
      # "added then removed within the PR" cases that a working-tree-only scan
      # misses, without re-flagging the ~30 known test-fixture false positives
      # that already exist in main's history (test/postmortem.test.ts,
      # test/secret-scan.test.ts, etc. — these are tests-of-the-test-tooling).
      #
      # Push to main: scan the current working tree only. Pre-existing
      # history is already locked in and need not be rescanned every push.
      - name: Run gitleaks (PR commit range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            .

      - name: Run gitleaks (working tree)
        if: github.event_name != 'pull_request'
        run: ./gitleaks dir --redact --no-banner --exit-code 1 .
