name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app.ts'
      - 'src/config/**'
      - 'src/db/**'
      - 'src/web/**'
      - 'test/setup.ts'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contract-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/app.ts'
      - 'src/config/**'
      - 'src/db/**'
      - 'src/web/**'
      - 'test/setup.ts'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/contract-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract-tests:
    name: Vitest contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENLANDER_DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openlander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openlander_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Pin npm 11 — lockfile is generated locally with npm 11; Node 22
      # runners may default to npm 10, which misreads vitest's bundled
      # esbuild platform deps and fails npm ci. Install npm 11 into a
      # separate prefix and add it to PATH for this job.
      - name: Pin npm version
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-11" npm@11.5.1 --no-audit --no-fund
          echo "$RUNNER_TEMP/npm-11/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-11/node_modules/.bin/npm" --version

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install backend dependencies
        run: npm ci

      # tsc -b first so type errors fail CI fast (before the slower
      # contract-tests pre/post-test backend boot). Develop-bound PRs
      # don't currently hit the main-only ci.yml workflow which would
      # otherwise type-check the web frontend, so this is the only gate
      # catching latent web/src type errors before they merge.
      - name: Type check web
        working-directory: web
        run: npx tsc -b

      - name: Run contract tests
        working-directory: web
        run: npm run test:contract
        env:
          CONTRACT_TEST_PORT: 10117
          NODE_ENV: test
