name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.sisyphus/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.sisyphus/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm version
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      # Required for tests in test/web/* that import from web/src/ —
      # those imports resolve react / ansi-to-html / etc. against
      # web/node_modules, not the root install. Without this step
      # vitest test:coverage fails with "Cannot find package
      # 'ansi-to-html'" / "Cannot find module 'react/index.js'".
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
