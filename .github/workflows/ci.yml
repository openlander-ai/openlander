name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    env:
      OPENLANDER_DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test
      DATABASE_URL: postgresql://postgres:test@localhost:5432/openlander_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: openlander_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openlander_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Pin npm version
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      # Required for tests in test/web/* that import from web/src/ —
      # those imports resolve react / ansi-to-html / etc. against
      # web/node_modules, not the root install. Without this step
      # vitest test:coverage fails with "Cannot find package
      # 'ansi-to-html'" / "Cannot find module 'react/index.js'".
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
