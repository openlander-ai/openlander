<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Return to OpenLander</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0b0d10;
        color: #f4f4f5;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }
      p {
        color: #a1a1aa;
        line-height: 1.6;
      }
      button {
        display: inline-flex;
        margin-top: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        padding: 0.65rem 1rem;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Returning to OpenLander…</h1>
      <p id="status">You can close this window if it does not close automatically.</p>
      <button id="return-button" type="button" hidden>Return to OpenLander</button>
    </main>
    <script src="/cloudflare-oauth-callback.js"></script>
  </body>
</html>
